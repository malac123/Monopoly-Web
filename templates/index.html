<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Monopoly Webspiel - Setup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-content">
    <div class="container">
        <header>
            <h1>Monopoly Webspiel</h1>
        </header>
        <img src="{{ url_for('static', filename='img/IMG_0175.png') }}" alt="Wütender Mann" width="400"><br>
        <form id="setup-form">
            <h2>Spieler hinzufügen (2-8):</h2>
            <div id="player-inputs"></div>
            <button type="button" id="add-player-btn" onclick="addPlayerInput()">+</button>     
            <button type="button" onclick="removePlayerInput()">-</button><br><br>
            <button type="submit">Spiel starten</button>
            <div id="setup-error" style="color:red;"></div>
        </form>
        <button id="continue-game-btn" style="display:none;" onclick="window.location.href='/game.html'">Zum aktuellen Spiel</button>
    </div>
    <div class="spacer"></div>
    <div class="footer">
        <div class="footer-links">
            <h3> Links: </h3>
            <a href="https://github.com/malac123/Monopoly-Web.git" target="_blank" class="footer-link">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub" style="width:24px;vertical-align:middle;margin-right:8px;">GitHub
            </a>
            <a href="https://trello.com/b/9UAyXhOK/monopoly-web-server-version" target="_blank" class="footer-link">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/trello/trello-plain.svg" alt="Trello" style="width:24px;vertical-align:middle;margin-right:8px;">Trello
            </a>
        </div>
    </div>



    <!-- Script für die Spieler-Eingabe (Nicht selber geschrieben)-->
    <script src="{{ url_for('static', filename='game.js') }}"></script>
    <script>
        // Setup dynamic player input fields
        let playerCount = 2;
        function renderPlayerInputs() {
            const container = document.getElementById('player-inputs');
            container.innerHTML = '';
            for (let i = 0; i < playerCount; i++) {
                container.innerHTML += `<label for="player${i}">Spieler ${i+1} Name:</label>
                    <input type="text" id="player${i}" name="player_names" maxlength="20"><br>`;
            }
            // Hide + button if 8 player fields are already added to setup screen
            document.getElementById('add-player-btn').style.display = (playerCount >= 8) ? 'none' : '';
        }
        function addPlayerInput() {
            if (playerCount < 8) { playerCount++; renderPlayerInputs(); }
        }
        function removePlayerInput() {
            if (playerCount > 2) { playerCount--; renderPlayerInputs(); }
        }
        renderPlayerInputs();
        // Show continue button if game_id in sessionStorage
        if (sessionStorage.getItem('game_id')) {
            document.getElementById('continue-game-btn').style.display = '';
        }
    </script>




</body>
</html>
