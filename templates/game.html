<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Monopoly Webspiel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Monopoly Webspiel</h1>
        </header>
        <div id="game-area">
            <div id="board"></div>
            <div id="player-info"></div>
            <div id="actions"></div>
            <div id="game-error" style="color:red;"></div>
        </div>
        <button onclick="window.location.href='/'">Zurück zum Start</button>
    </div>
    <script src="{{ url_for('static', filename='game.js') }}"></script>
    <script>
    // --- Monopoly Game UI Logic ---
    const gameId = sessionStorage.getItem('game_id');
    if (!gameId) {
        window.location.href = '/';
    }
    let gameState = null;
    async function fetchGameState() {
        const res = await fetch(`/api/game_state/${gameId}`);
        if (!res.ok) {
            document.getElementById('game-error').textContent = 'Spiel nicht gefunden.';
            return;
        }
        gameState = await res.json();
        renderBoard();
        renderPlayers();
        renderActions();
    }
    function renderBoard() {
        const boardDiv = document.getElementById('board');
        boardDiv.innerHTML = '<h2>Spielbrett</h2><div class="board-grid"></div>';
        const grid = boardDiv.querySelector('.board-grid');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(10, 1fr)';
        grid.style.gap = '2px';
        gameState.board.forEach((space, i) => {
            const field = document.createElement('div');
            field.className = 'board-field' + (space.owner ? ' owned' : '');
            field.title = space.name;
            field.innerHTML = `<span>${space.name.slice(0,4)}${space.type==='jail'?'🚓':''}</span>`;
            // Show player markers
            gameState.players.forEach((p, idx) => {
                if (p.position === i) {
                    field.innerHTML += `<span class="player-marker p${idx+1}" title="${p.name}">${p.name[0]}</span>`;
                }
            });
            grid.appendChild(field);
        });
    }
    function renderPlayers() {
        const infoDiv = document.getElementById('player-info');
        infoDiv.innerHTML = '<h2>Spieler</h2>';
        gameState.players.forEach((p, idx) => {
            infoDiv.innerHTML += `<div class="player${idx === gameState.current_turn ? ' current' : ''}">
                <span class="player-name">${p.name}</span> - €${p.money} - Pos: ${p.position}
                ${p.in_jail ? '<span> (Gefängnis)</span>' : ''}
                <div>Grundstücke: ${p.properties.join(', ')}</div>
            </div>`;
        });
    }
    function renderActions() {
        const actionsDiv = document.getElementById('actions');
        actionsDiv.innerHTML = '';
        const currentPlayer = gameState.players[gameState.current_turn];
        if (gameState.is_active) {
            if (currentPlayer.name === gameState.current_player) {
                actionsDiv.innerHTML += `<button onclick="rollDice()">Würfeln</button>`;
                // Check if can buy property
                const space = gameState.board[currentPlayer.position];
                if (space.type === 'property' && !space.owner) {
                    actionsDiv.innerHTML += `<button onclick="buyProperty()">Kaufen (${space.name} für €${space.cost})</button>`;
                }
                actionsDiv.innerHTML += `<button onclick="endTurn()">Zug beenden</button>`;
            } else {
                actionsDiv.innerHTML = 'Bitte warte auf deinen Zug.';
            }
        } else {
            actionsDiv.innerHTML = 'Spiel beendet.';
        }
    }
    async function rollDice() {
        const res = await fetch('/api/roll_dice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ game_id: gameId })
        });
        await fetchGameState();
    }
    async function buyProperty() {
        const res = await fetch('/api/buy_property', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ game_id: gameId })
        });
        await fetchGameState();
    }
    async function endTurn() {
        const res = await fetch('/api/end_turn', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ game_id: gameId })
        });
        await fetchGameState();
    }
    fetchGameState();
    </script>
</body>
</html>
